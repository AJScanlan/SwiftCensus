# Lima template for the macOS census guest (ADR 0006). Deliberately NOT based on template:_default/mounts:
# that mounts the host's home directory, which F3 forbids. No mounts at all.
minimumLimaVersion: 2.1.0
os: Darwin
arch: aarch64
vmType: vz

images:
# Apple's public restore-image catalog (mesu.apple.com/assets/macos/com_apple_macOSIPSW), macOS 27.0.1 (26A434).
# Downloaded file's SHA-1 matched the catalog's (7e020710acade1911309aa73901ed5a92790bafc); 26,637,307,067 bytes.
- location: "https://updates.cdn-apple.com/2026FallFCS/59241290-5d51-4ca8-9df4-31624b9a4eac/UniversalMac_27.0.1_26A434_Restore.ipsw"
  arch: aarch64
  digest: "sha256:2f016638293c3e641b8b25391a76fbc16563b3711915a5551cf8aa0f5598a5c1"

cpus: 6
memory: 6GiB
disk: 100GiB
mounts: []

# The installer seems to require the display device to be present.
video:
  display: "default"
